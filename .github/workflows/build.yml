name: Build PHP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REVISION: '2'
  SOURCE_URL: https://packages.sury.org/php/pool/main/p

jobs:
  build:
    name: php${{ matrix.php }}-${{ matrix.os.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1']
        os:
          - {target: ubuntu16.04, image: 'ubuntu:16.04'}
          - {target: ubuntu16.10, image: 'ubuntu:16.10'}
          - {target: ubuntu17.04, image: 'ubuntu:17.04'}
          - {target: ubuntu17.10, image: 'ubuntu:17.10'}
          - {target: ubuntu18.04, image: 'ubuntu:18.04'}
          - {target: ubuntu18.10, image: 'ubuntu:18.10'}
          - {target: ubuntu19.04, image: 'ubuntu:19.04'}
          - {target: ubuntu19.10, image: 'ubuntu:19.10'}
          - {target: ubuntu20.04, image: 'ubuntu:20.04'}
          - {target: debian9, image: 'debian:stretch'}
          - {target: debian10, image: 'debian:buster'}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download pinned source
        env:
          PHP: ${{ matrix.php }}
        run: |
          mkdir sources out
          grep -F "  php${PHP}_" sources.sha256 > sources/SHA256SUMS
          while read -r _ file; do
            curl -fsSL --retry 3 "$SOURCE_URL/php$PHP/$file" -o "sources/$file"
          done < sources/SHA256SUMS
          (cd sources && sha256sum -c SHA256SUMS)
      - name: Build native amd64 packages in Docker
        env:
          PHP: ${{ matrix.php }}
          TARGET: ${{ matrix.os.target }}
          IMAGE: ${{ matrix.os.image }}
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/repo:ro" -v "$PWD/sources:/sources:ro" -v "$PWD/out:/out" \
            -e PHP -e TARGET -e REVISION -e JOBS=4 "$IMAGE" bash /repo/build.sh 2>&1 | tee out/build.log
          test -s out/SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: php${{ matrix.php }}-${{ matrix.os.target }}-amd64
          path: out/
          retention-days: 7

  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'tweis/php-sury-backport'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PHP: ${{ matrix.php }}
        run: |
          upstream=$(sed -n "s/.*  php${PHP}_\([0-9.]*\)\.orig\.tar\.xz$/\1/p" sources.sha256)
          tag="v$upstream-$REVISION"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already released; bump REVISION to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.check.outputs.publish
        with:
          path: artifacts
          pattern: php${{ matrix.php }}-*-amd64
      - name: Upload release packages and source
        if: steps.check.outputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          PHP: ${{ matrix.php }}
          UPSTREAM: ${{ steps.check.outputs.upstream }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          mkdir release
          for dir in artifacts/*; do
            tar -cJf "release/$(basename "$dir").tar.xz" -C "$dir" .
          done
          grep -F "  php${PHP}_" sources.sha256 > sources.php
          while read -r _ file; do
            curl -fsSL --retry 3 "$SOURCE_URL/php$PHP/$file" -o "release/$file"
          done < sources.php
          (cd release && sha256sum -c ../sources.php)
          tar -cJf "release/php$PHP-source.tar.xz" -C release --files-from <(awk '{print $2}' sources.php)
          # GitHub normalizes tildes in asset names; match that before checksumming.
          for file in release/*~*; do
            [ ! -e "$file" ] || mv "$file" "${file//\~/.}"
          done
          (cd release && sha256sum ./* > SHA256SUMS)
          gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "PHP $UPSTREAM backports ($TAG)" --notes-file README.md
          gh release upload "$TAG" release/*
          gh release edit "$TAG" --draft=false
